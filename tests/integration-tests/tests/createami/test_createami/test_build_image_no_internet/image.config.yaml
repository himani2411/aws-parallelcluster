Image:
    RootVolume:
        Size: 200
        Encrypted: True

Build:
    InstanceType: {{ instance }}
    ParentImage: {{ parent_image }}
    SecurityGroupIds:
        - {{ security_group_id }}
    SubnetId: {{ subnet_id }}
    Iam:
        AdditionalIamPolicies:
            - Policy: arn:aws:iam::aws:policy/AmazonS3FullAccess

DevSettings:
    TerminateInstanceOnFailure: True
    Cookbook:
        ChefCookbook: {{ chef_cookbook }}
        ExtraChefAttributes: '{"cluster": {"skip_awsbatch_cli_install": "true"}}'
    NodePackage: {{ node_package }}
